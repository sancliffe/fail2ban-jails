[apache-env]
enabled  = true
port     = http,https
filter   = apache-env
logpath  = /var/log/apache2/access.log
maxretry = 1
findtime = 30m
bantime  = 24h

[apache-connect-probe]
enabled  = true
port     = http,https
filter   = apache-connect-probe
logpath  = /var/log/apache2/access.log
maxretry = 1
findtime = 1h
bantime  = 24h

[apache-badstatus]
enabled  = true
port     = http,https
filter   = apache-badstatus
logpath  = /var/log/apache2/access.log
maxretry = 2
findtime = 1h
bantime  = 24h

[apache-php-scan]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/access.log
backend  = auto
filter   = apache-php-scan
maxretry = 1
findtime = 60m
bantime  = 24h

[apache-web-stratum]
enabled  = true
port     = http,https
filter   = web-stratum
logpath  = /var/log/apache2/access.log
maxretry = 1
findtime = 1h
bantime  = 24h

[apache-scanner]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/access.log
backend  = auto
filter   = apache-scanner
maxretry = 5
findtime = 60
bantime  = 86400