[recidive]
enabled   = true
logpath   = /var/log/fail2ban.log
banaction = ufw
findtime  = 3d
maxretry  = 2
bantime   = 7d
# Keep AbuseIPDB reporting restricted to repeat offenders here to save your API quota
action    = %(action_)s
            %(action_abuseipdb)s[abuseipdb_apikey="REMOVED-UPDATE-ME", abuseipdb_category="18,22"]