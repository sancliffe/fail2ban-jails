[sshd]
enabled  = true
maxretry = 3
findtime = 10m
bantime  = 1h

[dovecot]
enabled            = true
port               = pop3,pop3s,imap,imaps,submission,sieve
logpath            = /var/log/mail.log
maxretry           = 3
findtime           = 10m
bantime            = 1h

[postfix]
enabled            = true
port               = smtp,ssmtp,submission,submissions
logpath            = /var/log/mail.log
mode               = aggressive
findtime           = 45m
maxretry           = 3
bantime            = 24h